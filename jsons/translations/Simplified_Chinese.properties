To play this mode, you must see the terms. = 游玩此模式必看条款\n1. 年龄确认与访问资格\n 本模组中有部分成人内容仅限 年满18周岁（或您所在司法管辖区规定的法定成人年龄）的用户游玩或修改模式。通过访问或使用本模组，您明确声明并保证：\n  - 您已达到法定成人年龄；\n  - 您自愿选择接触可能包含成人性质的内容（包括但不限于裸露、性内容、暴力或其他敏感主题）。\n - 您游玩或修改本模组时默认你已经同意本条款内容。\n2. 未成年人使用禁止与责任豁免\n 若未成年人违反本条款访问或游玩本模组中成人模式，相关责任由其监护人或法定代理人承担。开发者及分发方不承担因以下情况导致的任何直接、间接或偶然责任：\n - 未成年人通过虚假陈述、规避年龄验证或其他非法手段使用本模组； \n  - 监护人对未成年人设备或行为监管疏忽导致的任何后果。\n  -末成年人以隐瞒自己的年龄不符合时，通过自己的主观想法或客观想法想尝试而造成的任何后果。\n4. 免责范围\n 开发者不对以下情况负责：\n-  用户因违反本条款或当地法律使用模组而产生的任何法律后果；\n  - 用户因误解、误用模组内容而导致的生理、心理或道德争议。\n 5. 管辖法律与争议解决\n 本条款受[本模组作者所在地]法律管辖。任何与本条款相关的争议应通过友好协商解决；协商不成的，应提交至[本模组作者所在地]处理。\n6.条款解释归属权
